name: MLWorkflow

on: workflow_dispatch          # run manually from the Actions tab

jobs: 
  job1:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./modelCleaning
    steps:
      - name: setup python3.10
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: setup code repo
      - uses: actions/checkout@v6
      - name: Clean data
        run: |
          pip3 install pandas joblib scikit-learn
          python cleanData.python
          ls -l
      - name: TrainModel
        run: |
          pytho train_test.py
          ls -l
